name: PRD 1 Copy Migration

on:
  pull_request:
    types: [synchronize]
    branches: [master]
    paths:
      - '.github/workflows/prd1-copy-migration.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  migrate:
    if: github.head_ref == 'seo-recovery-prd-01-product-truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Migrate owned product claims
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          credit = re.compile(r'\b(?:3|5|10)\s+(?:free\s+)?credits\b', re.I)
          no_signup = re.compile(r'\bno\s+sign[ -]?up(?:\s+(?:needed|required))?\b', re.I)
          no_account = re.compile(r'\bno\s+account(?:\s+(?:needed|required))?\b', re.I)
          without_account = re.compile(r'\bwithout\s+(?:an\s+)?account\b', re.I)
          without_signup = re.compile(r'\bwithout\s+signing\s+up\b', re.I)

          def safe_credit_copy(text):
              return credit.sub('welcome credits where available', text)

          def safe_account_copy(text):
              text = safe_credit_copy(text)
              text = no_signup.sub('account required', text)
              text = no_account.sub('account required', text)
              text = without_account.sub('after creating an account', text)
              return without_signup.sub('after creating an account', text)

          def mutate_page_blocks(path, slugs, transform):
              p = Path(path)
              text = p.read_text()
              marker = re.compile(r'(?m)^    \{\n      "slug": "([^"]+)"')
              matches = list(marker.finditer(text))
              if not matches:
                  raise RuntimeError(f'no page blocks in {path}')
              out, cursor = [], 0
              for index, match in enumerate(matches):
                  start = match.start()
                  end = matches[index + 1].start() if index + 1 < len(matches) else len(text)
                  out.append(text[cursor:start])
                  block = text[start:end]
                  out.append(transform(block) if match.group(1) in slugs else block)
                  cursor = end
              p.write_text(''.join(out))

          free_slugs = {
              'free-image-upscaler', 'free-photo-enhancer', 'free-image-enhancer',
              'free-ai-photo-enhancer', 'free-ai-upscaler',
          }
          tool_slugs = {'ai-image-upscaler', 'ai-photo-enhancer', 'photo-quality-enhancer'}
          for path in ('app/seo/data/free.json', 'locales/en/free.json'):
              mutate_page_blocks(path, free_slugs, safe_account_copy)
          for path in ('app/seo/data/tools.json', 'locales/en/tools.json'):
              mutate_page_blocks(path, tool_slugs, safe_account_copy)

          for path in ('app/seo/data/scale.json', 'locales/en/scale.json',
                       'locales/en/blog.json', 'locales/en/help.json', 'locales/en/tools-ui.json'):
              p = Path(path)
              if p.exists():
                  p.write_text(safe_credit_copy(p.read_text()))

          def rewrite_owned_product(value, owned=False):
              if isinstance(value, list):
                  return [rewrite_owned_product(v, owned) for v in value]
              if not isinstance(value, dict):
                  return safe_account_copy(value) if owned and isinstance(value, str) else value
              now_owned = owned or value.get('name') == 'MyImageUpscaler'
              return {k: rewrite_owned_product(v, now_owned) for k, v in value.items()}

          for path in ('app/seo/data/comparison.json', 'locales/en/comparison.json', 'locales/en/compare.json'):
              p = Path(path)
              if not p.exists():
                  continue
              data = json.loads(p.read_text())
              p.write_text(json.dumps(rewrite_owned_product(data), indent=2, ensure_ascii=False) + '\n')

          for path in ('app/seo/data/tools.json', 'locales/en/tools.json'):
              p = Path(path)
              text = p.read_text()
              text = text.replace(
                  '"supportedFormats": ["JPEG", "PNG", "WebP"]',
                  '"supportedFormats": ["JPEG", "PNG", "WebP", "HEIC"]',
                  1,
              )
              text = text.replace('Upload JPEG, PNG, or WebP.', 'Upload JPEG, PNG, WebP, or HEIC.')
              text = text.replace(
                  'Supports JPEG, PNG, WebP up to 64MB.',
                  'Supports JPEG, PNG, WebP, and HEIC; the app validates the current size limit.',
              )
              replacements = {
                  'even small text remains perfectly readable': 'small text can remain more readable',
                  'must remain perfectly legible': 'should remain readable',
                  'without artifacts or halos': 'while reducing artifacts and halos',
                  'Neural network trained on millions of image pairs': 'AI-assisted detail reconstruction',
                  'based on patterns learned from millions of images': 'using model-assisted detail reconstruction',
                  'our neural network actually generates new pixel information based on millions of high-resolution training images': 'the selected AI model reconstructs plausible detail instead of relying only on interpolation',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text)

          for p in Path('content/blog').glob('*.mdx'):
              lines = p.read_text().splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if 'myimageupscaler' in line.lower() and credit.search(line):
                      lines[i] = safe_credit_copy(line)
              p.write_text(''.join(lines))

          for path in ('.claude/skills/blog-writing/SKILL.md', '.agents/skills/blog-writing/SKILL.md'):
              p = Path(path)
              if p.exists():
                  p.write_text(p.read_text().replace(
                      '[Try myimageupscaler.com free](/pricing) — 10 credits, no credit card required.',
                      '[Try MyImageUpscaler](/pricing) — welcome credits vary by region.',
                  ))
      - name: Format migrated files
        run: yarn prettier --write app/seo/data locales/en
      - name: Product capability contract
        run: yarn vitest run tests/unit/seo/capability-claims.unit.spec.ts tests/unit/seo/free-credit-policy-copy.unit.spec.ts
      - name: Repository verify
        run: yarn verify
      - name: Commit migrated copy
        if: success()
        run: |
          rm .github/workflows/prd1-copy-migration.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/seo/data locales/en content/blog .claude/skills/blog-writing/SKILL.md .agents/skills/blog-writing/SKILL.md .github/workflows/prd1-copy-migration.yml
          git commit -m 'fix(seo): migrate owned capability claims'
          git push origin HEAD:${{ github.head_ref }}
