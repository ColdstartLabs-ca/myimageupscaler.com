name: Deploy to Cloudflare Workers (OpenNext)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript compiler
        run: yarn tsc

      - name: Run ESLint
        run: yarn lint

      - name: Run unit tests
        run: yarn test:unit

      - name: Run PostgreSQL migration test in isolation
        run: yarn vitest run tests/unit/server/services/email-recipient-value-performance-postgres.unit.spec.ts --maxWorkers=1
        env:
          RUN_POSTGRES_TESTS: '1'
          POSTGRES_TEST_URL: postgresql://postgres:test@127.0.0.1:54329/postgres

      - name: Check cron worker setup
        run: yarn cron:check

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: quality
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify production Stripe configuration
        run: yarn deploy:stripe:guard
        env:
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Build for Cloudflare Workers (OpenNext)
        run: |
          npx tsx scripts/build-blog.ts
          npx next build --webpack
          npx opennextjs-cloudflare build --skipNextBuild
        env:
          # Public environment variables (NEXT_PUBLIC_*)
          # See .env.example for full list
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          # Stripe Price IDs are now configured in shared/config/stripe.ts
          NEXT_PUBLIC_BASELIME_KEY: ${{ vars.NEXT_PUBLIC_BASELIME_KEY }}
          NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ vars.NEXT_PUBLIC_AMPLITUDE_API_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          # Server-side environment variables
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AMPLITUDE_API_KEY: ${{ vars.NEXT_PUBLIC_AMPLITUDE_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json

      - name: Deploy cron worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/cron/wrangler.toml

      - name: Verify cron schedules
        run: yarn cron:check --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Output deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"

  health-check:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: production
    steps:
      - name: Wait for deployment propagation
        run: sleep 30

      - name: Verify deployed Worker through Cloudflare API
        run: |
          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts/myimageupscaler/deployments")
          echo "$RESPONSE" | jq -e '.success == true and (.result.deployments | length) > 0' >/dev/null
          echo "Cloudflare reports an active myimageupscaler Worker deployment."

      - name: Verify live application health
        env:
          PRODUCTION_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
        run: |
          test -n "$PRODUCTION_BASE_URL"
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 20 \
            "${PRODUCTION_BASE_URL%/}/api/health" >/dev/null
