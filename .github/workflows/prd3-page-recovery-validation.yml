name: PRD 3 Page Recovery Validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'client/**'
      - 'app/seo/data/**'
      - 'locales/en/**'
      - 'seo-reports/**'
      - 'tests/unit/seo/**'
      - '.github/workflows/prd3-page-recovery-validation.yml'

permissions:
  contents: read

jobs:
  page-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Page recovery contract
        run: yarn vitest run tests/unit/seo/page-recovery-contract.unit.spec.ts tests/unit/seo/homepage-performance.unit.spec.ts tests/unit/seo/pseo-hero-lcp.unit.spec.ts tests/unit/seo/topaz-free-trial-snippet.unit.spec.ts
      - name: Repository verify
        run: yarn verify
